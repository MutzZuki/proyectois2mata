<!DOCTYPE html>
<!-- Indica al navegador que el documento utiliza el estándar HTML5. -->
<html lang="es">
<!-- Elemento raíz; lang="es" informa que el contenido está en español. -->
<head>
    <!-- Permite mostrar correctamente caracteres especiales como ñ y acentos. -->
    <meta charset="UTF-8">
    <!-- Hace que el diseño se adapte al ancho de la pantalla del dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Texto que aparece en la pestaña del navegador. -->
    <title>Formulario Estilizado</title>
    <!-- Carga la hoja de estilos de Bootstrap 5 desde un CDN. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css&quot; rel="stylesheet">
   
    <!-- Estilos personalizados del formulario. -->
    <style>
        /* Contenedor principal de la tarjeta del formulario. */
        .box {
            max-width: 360px;
            margin: 50px auto;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgb(129, 20, 20);
            font-family: sans-serif;
            background: #fff;
        }

        /* Encabezado oscuro de la tarjeta. */
        .sky {
            height: 120px;
            background: linear-gradient(100deg, #252eb4, #c52626, #2b2b9b);
            position: relative;
            text-align: center;
            color: #fff;
            padding-top: 35px;
        }

        /* Estilo del título dentro del encabezado. */
        .sky h2 {
            margin: 0;
            font-size: 20px;
        }

        /* Estilo del texto secundario del encabezado. */
        .sky p {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: .7;
        }

        /* Pseudo-elemento que crea la curva blanca en la parte inferior. */
        .sky::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 30px;
            background: #fff;
            border-radius: 50% 50% 0 0;
        }

        /* Espaciado interior de la sección que contiene el formulario. */
        .body {
            padding: 24px;
        }

        /* Formato de las etiquetas de cada campo. */
        .body label {
            display: block;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #444;
        }

        /* Apariencia general de los campos de entrada. */
        .body .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        /* Cambia el borde del campo cuando el usuario lo selecciona. */
        .body .form-control:focus {
            outline: none;
            box-shadow: none;
            border-color: #302b63;
        }

        /* Apariencia y tamaño del botón de envío. */
        .body .btn-custom {
            width: 100%;
            margin-top: 18px;
            padding: 11px;
            background: #65c908;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        /* Reduce la opacidad del botón al pasar el cursor sobre él. */
        .body .btn-custom:hover {
            opacity: .85;
            color: #ffffff;
        }
    </style>
</head>
<!-- Contenido visible de la página; bg-light aplica un fondo claro de Bootstrap. -->
<body class="bg-light">

    <!-- Tarjeta principal que agrupa el encabezado y el formulario. -->
    <div class="box">
        <!-- Encabezado con el nombre del sistema y un mensaje informativo. -->
        <div class="sky">
            <h2>Ingreso UDL_IS</h2>
            <p>Crear gratis una cuenta</p>
        </div>

        <!-- Cuerpo de la tarjeta donde se encuentran los campos. -->
        <div class="body">
            <!-- Formulario que agrupa los datos que introduce el usuario. -->
            <form>
                <!-- Campo para capturar el nombre de usuario. -->
                <div>
                    <label>Nombre</label>
                    <input type="text" class="form-control" placeholder="Captura nombre de usuario" required>
                </div>

                <!-- Campo para capturar y validar un correo electrónico. -->
                <div>
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="user_name@dominio.com" required>
                </div>

                <!-- Campo de contraseña; type=password oculta los caracteres. -->
                <div>
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <!-- Botón que muestra un mensaje al hacer clic. -->
                <button type="button" class="btn btn-custom" onclick="alert('Welcome!')">Enviar datos</button>
            </form>
        </div>
    </div>

    <!-- Carga el JavaScript de Bootstrap y sus componentes interactivos. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script&gt;
</body>
</html>

<!-- JavaScript de validación, incluido directamente en este mismo archivo. -->
  <script>
    // Escucha el envío del formulario identificado como loginForm.
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      // Evita que el navegador recargue la página al enviar el formulario.
      e.preventDefault();
     
      // Obtiene los valores introducidos en los campos de correo y contraseña.
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      // Carga y lee el archivo XML que contiene los usuarios registrados.
      const res = await fetch('usuarios.xml');
      const xmlText = await res.text();
      // Convierte el texto XML en un documento que puede consultarse con selectores.
      const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');

      // Obtiene todos los usuarios y busca una coincidencia de correo y contraseña.
      const usuarios = Array.from(xmlDoc.querySelectorAll('usuario'));
      const existe = usuarios.some(u =>
        u.querySelector('email').textContent === email &&
        u.querySelector('password').textContent === pass
      );

      // Redirige al panel si las credenciales son válidas.
      if (existe) {
        window.location.href = 'dashboard.html';
      } else {
        // Informa al usuario cuando no se encuentra una coincidencia.
        alert('Usuario o contraseña incorrectos');
      }
    });
  </script>
